<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calentamiento 6 minutos - EF</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    padding: 30px 15px;
}

h1 {
    font-size: 28px;
}

button {
    font-size: 20px;
    padding: 15px 25px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}

#generar {
    background: #222;
    color: white;
}

#empezar {
    background: #1a8f3c;
    color: white;
}

#empezar:disabled {
    background: #aaa;
}

#canciones {
    background: white;
    padding: 20px;
    margin: 20px auto;
    max-width: 500px;
    border-radius: 12px;
}

#tiempo {
    font-size: 60px;
    font-weight: bold;
    margin-top: 30px;
}
</style>
</head>

<body>

<h1>🔥 Calentamiento — 6 minutos</h1>

<button id="generar">
GENERAR CALENTAMIENTO
</button>

<div id="canciones">
Pulsa «GENERAR CALENTAMIENTO»
</div>

<button id="empezar" disabled>
EMPEZAR
</button>

<div id="tiempo">
06:00
</div>

<audio id="audioCancion" preload="auto"></audio>
<audio id="audioPitido" preload="auto"></audio>

<script>

const canciones = [
    "A Dios le pido.mp3",
    "Caminando por la vida.mp3",
    "La casa por el tejado.mp3",
    "La graciosa.mp3",
    "Me equivoque.mp3",
    "Morocha.mp3",
    "So payaso.mp3",
    "Por la boca vive el pez.mp3",
    "Suavemente.mp3",
    "Una cerveza.mp3",
    "Vereda de la puerta.mp3",
    "Zapatillas.mp3"
];

let seleccionadas = [];
let actual = 0;
let tiempoRestante = 360;

let intervalo = null;
let temporizadorCambio = null;

const audioCancion = document.getElementById("audioCancion");
const audioPitido = document.getElementById("audioPitido");

const lista = document.getElementById("canciones");
const empezar = document.getElementById("empezar");
const tiempo = document.getElementById("tiempo");


// PITIDO

audioPitido.src = "./pitido.mp3";


// GENERAR 3 CANCIONES ALEATORIAS

document.getElementById("generar").onclick = function() {

    seleccionadas = [...canciones]
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

    lista.innerHTML = `
        <strong>Calentamiento generado:</strong>
        <br><br>
        1. ${seleccionadas[0]}
        <br>
        2. ${seleccionadas[1]}
        <br>
        3. ${seleccionadas[2]}
    `;

    empezar.disabled = false;
};


// EMPEZAR

empezar.onclick = function() {

    clearInterval(intervalo);
    clearTimeout(temporizadorCambio);

    audioCancion.pause();
    audioPitido.pause();

    actual = 0;
    tiempoRestante = 360;

    tiempo.textContent = "06:00";

    empezar.disabled = true;

    reproducirCancion(0);

    intervalo = setInterval(function() {

        tiempoRestante--;

        actualizarTiempo();


        // 4:00 → PITIDO → SIGUIENTE

        if (tiempoRestante === 240) {
            cambiarCancion();
        }


        // 2:00 → PITIDO → SIGUIENTE

        if (tiempoRestante === 120) {
            cambiarCancion();
        }


        // 0:00 → FIN

        if (tiempoRestante <= 0) {

            clearInterval(intervalo);
            clearTimeout(temporizadorCambio);

            audioCancion.pause();

            tiempo.textContent = "FIN";

            empezar.disabled = false;
        }

    }, 1000);
};


// ACTUALIZAR TIEMPO

function actualizarTiempo() {

    const minutos = Math.floor(tiempoRestante / 60);
    const segundos = tiempoRestante % 60;

    tiempo.textContent =
        String(minutos).padStart(2, "0") +
        ":" +
        String(segundos).padStart(2, "0");
}


// REPRODUCIR CANCIÓN

function reproducirCancion(numero) {

    actual = numero;

    clearTimeout(temporizadorCambio);

    audioCancion.pause();

    audioCancion.currentTime = 0;

    audioCancion.src =
        "./" + encodeURIComponent(seleccionadas[numero]);

    audioCancion.load();

    audioCancion.play().catch(function(error) {

        console.log(
            "Error reproduciendo:",
            seleccionadas[numero],
            error
        );

    });
}


// CAMBIAR DE CANCIÓN

function cambiarCancion() {

    // Parar canción actual

    audioCancion.pause();
    audioCancion.currentTime = 0;


    // Sonar pitido

    audioPitido.currentTime = 0;

    audioPitido.play().catch(function(error) {

        console.log(
            "Error reproduciendo el pitido:",
            error
        );

    });


    // Después de 1 segundo empieza la siguiente

    temporizadorCambio = setTimeout(function() {

        if (actual < 2) {
            reproducirCancion(actual + 1);
        }

    }, 1000);
}

</script>

</body>
</html>
